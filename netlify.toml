[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "pdfkit", "pptxgenjs", "docx"]

# ogni giorno alle 23:59 ora italiana (orario in UTC: 22:59 = 23:59 con l ora solare, valida fino a fine marzo): backup + report su Dropbox
[functions."report-automatico"]
  schedule = "59 22 * * *"

[[redirects]]
  from = "/dropbox"
  to = "/.netlify/functions/dropbox"
  status = 200
  force = true

[[redirects]]
  from = "/glossario"
  to = "/glossario.html"
  status = 200
  force = true

[[redirects]]
  from = "/r/*"
  to = "/riservata.html"
  status = 200
  force = true

[[redirects]]
  from = "/consenso"
  to = "/consenso.html"
  status = 200
  force = true

[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200
  force = true

[[redirects]]
  from = "/scopri"
  to = "/scopri.html"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"  # solo il sito stesso può incorniciare le sue pagine (pagina pubblica nel visore dell'app)
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/scopri*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/glossari.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw-glossari.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/glossario"
