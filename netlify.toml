[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "pdfkit"]

# ogni sera alle 21:00 (ora italiana d'inverno; 22:00 con l'ora legale): backup + report su Dropbox
[functions."report-automatico"]
  schedule = "0 20 * * *"

[[redirects]]
  from = "/dropbox"
  to = "/.netlify/functions/dropbox"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
