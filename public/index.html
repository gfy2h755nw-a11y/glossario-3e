<style>@font-face{font-family:'Archivo';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/archivo-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Archivo';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/archivo-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Archivo';font-style:italic;font-weight:600;font-display:swap;src:url(/fonts/archivo-latin-600-italic.woff2) format('woff2')}@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/archivo-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Archivo';font-style:normal;font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Archivo';font-style:normal;font-weight:900;font-display:swap;src:url(/fonts/archivo-latin-900-normal.woff2) format('woff2')}@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2')}@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;font-display:swap;src:url(/fonts/cormorant-garamond-latin-600-italic.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-400-italic.woff2) format('woff2')}@font-face{font-family:'Atkinson Hyperlegible';font-style:italic;font-weight:700;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-700-italic.woff2) format('woff2')}</style>
<style>
:root{
  --ink:#15212B; --ink2:#3E4C59; --muted:#5B6976; --line:#D3DCE3; --bg:#EEF2F5; --card:#FFFFFF;
  --a1:#1F5FA8; --a2:#6B4FA0; --a3:#B4511A; --a4:#2E7D32;
  --ok:#2E7D32; --okbg:#E3F1E4; --warn:#9A4A00; --warnbg:#FCEBD9; --info:#1F5FA8; --infobg:#E2ECF7; --err:#B0304A; --errbg:#F8E1E6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3,.disp{font-family:'Archivo',system-ui,sans-serif;letter-spacing:-0.01em}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.top{background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.top .brand{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:18px}
.top .brand small{display:block;font-weight:600;font-size:13px;opacity:.75;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-family:'Archivo',system-ui,sans-serif;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.warn{background:#fff;color:var(--err);border-color:var(--err)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700;font-family:'Archivo',system-ui,sans-serif}
.s-vuota{background:#EEF2F5;color:var(--muted)}
.s-bozza{background:#FFF6D6;color:#7A5B00}
.s-inviata{background:var(--infobg);color:var(--info)}
.s-correggere{background:var(--warnbg);color:var(--warn)}
.s-approvata{background:var(--okbg);color:var(--ok)}
label{font-weight:700;font-size:15px}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
input:focus,textarea:focus,select:focus,.btn:focus-visible{outline:3px solid #9CC3EE;outline-offset:1px}
textarea{min-height:104px;resize:vertical}
.cnt{font-size:14px;color:var(--muted);text-align:right}
.cnt.over{color:var(--err);font-weight:700}
.term-it{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.15}
.term-en{font-family:'Archivo',system-ui,sans-serif;font-weight:600;font-style:italic;font-size:17px}
.lang{border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.lang h3{margin:0 0 8px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{border-radius:12px;padding:10px 14px;font-size:15px}
.note.warn{background:var(--warnbg);color:#5A2D00}
.note.info{background:var(--infobg);color:#0F3560}
.note.err{background:var(--errbg);color:#6E1328}
.fixed-text{background:#F6F8FA;border-radius:12px;padding:10px 14px}
.bar{height:10px;border-radius:999px;background:#E3E9EE;overflow:hidden}
.bar>span{display:block;height:100%}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tappe{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tappe li{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #EEF2F5}
.tappe li.past{color:var(--muted)}
.tappe li.next{font-weight:700}
.tappe .d{font-family:'Archivo',system-ui,sans-serif;font-weight:700}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;max-width:92vw;display:none;z-index:50}
#toast.err{background:var(--err)}
.login{max-width:440px;margin:7vh auto 0}
.login h1{font-size:40px;line-height:1;margin:0}
.poster-box{background:#C9D2DA;border-radius:14px;padding:12px;overflow:hidden}
.poster-scale{transform-origin:top left}
details summary{cursor:pointer;font-weight:700;font-family:'Archivo',system-ui,sans-serif}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl td.n{text-align:right;font-family:'Archivo',system-ui,sans-serif;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){ .term-it{font-size:20px} .tappe li{grid-template-columns:96px 1fr} }
.ops{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:400;font-size:16px;line-height:1.4;background:#fff}
.op:hover{border-color:#9CC3EE}
.op input{position:absolute;opacity:0;width:1px;height:1px}
.op .lt{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:14px;color:var(--ink2)}
.op.on{border-color:var(--a1);background:#F0F6FD}
.op.on .lt{background:var(--a1);border-color:var(--a1);color:#fff}
.op:focus-within{outline:3px solid #9CC3EE;outline-offset:1px}
.op.no{opacity:.55;cursor:not-allowed;text-decoration:line-through}
.op.no em{text-decoration:none}
.esito{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15px}
.esito.si{background:var(--okbg);color:#1D4D20}
.esito.no{background:var(--errbg);color:#6E1328}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cd-box{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.cd-t{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:18px}
.cd{display:flex;gap:8px}
.cd-u{display:flex;flex-direction:column;align-items:center;min-width:54px;background:#EEF2F5;border-radius:10px;padding:6px 4px}
.cd-u b{font-family:'Archivo',system-ui,sans-serif;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd-u small{font-size:12px;color:var(--muted)}
.cd.urg .cd-u{background:var(--warnbg)}.cd.urg .cd-u b{color:var(--warn)}
.cd-scaduta{font-weight:700;color:var(--err)}
.voto-box{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.voto-n{font-family:'Archivo',system-ui,sans-serif;font-weight:900;font-size:64px;line-height:1}
.voto-n small{font-size:22px;color:var(--muted);font-weight:700}
.escluso{border:3px solid var(--err);background:var(--errbg);color:#6E1328}
.kpi-c{background:#F6F8FA;border-radius:12px;padding:12px 14px}
.kpi-n{font-family:'Archivo',system-ui,sans-serif;font-weight:900;font-size:32px;line-height:1.1}
.riga-esclusa td{background:#FBF0F2}
.admin{border:2px solid var(--ink)}
.vf{min-width:200px}
.vls{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.vl{background:#F6F8FA;border-radius:12px;padding:10px 14px;min-width:140px;flex:1}
.vl-n{font-family:'Archivo',system-ui,sans-serif;font-weight:900;font-size:34px;line-height:1.1}
.vl-n small{font-size:15px;color:var(--muted);font-weight:700}
.note-ered{background:var(--infobg);border-color:#B9D0EC;color:#0F3560}

/* ---------- area docenti: barra laterale + pagina centrale ---------- */
.dapp{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#DCE3E9;display:flex;flex-direction:column;gap:12px;padding:16px 14px 12px;position:sticky;top:0;height:100vh;overflow:hidden;z-index:30}
.sbrand{display:flex;gap:10px;align-items:center;padding:0 6px}
.slogo{width:38px;height:38px;flex:none;border-radius:10px;background:#fff;color:var(--err);font:800 22px 'Archivo',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.sbrand b{font:800 16px 'Archivo',system-ui,sans-serif;color:#fff;display:block}
.sbrand span{font-size:12.5px;opacity:.75;display:block;line-height:1.3}
.smenu-x{display:none;margin-left:auto;background:none;border:0;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.sed{background:#1E2D3A;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.35}
.sed b{color:#fff;font:700 14px 'Archivo',system-ui,sans-serif}
.sed-l{opacity:.7;font-size:11.5px;font-weight:700;letter-spacing:.08em}
.sed-c{margin-top:4px;color:#F2B705;font-weight:700}
.sed.arch{background:#5A2D00}
.sbtn-arch{display:block;width:100%;margin-top:8px;background:#fff;color:var(--ink);border:0;border-radius:9px;padding:7px 8px;font:700 13px 'Archivo',system-ui,sans-serif;cursor:pointer}
.seg{display:flex;background:#0E171F;border-radius:10px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;border:0;background:none;padding:6px 0;border-radius:8px;font:700 13px 'Archivo',system-ui,sans-serif;color:#AFC0CE;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
.satt{display:block;margin-top:8px}.satt span{display:block;font:700 10.5px 'Archivo',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8FA3B4;margin-bottom:3px}.satt select{width:100%;min-height:40px;border-radius:8px;border:1px solid #33475A;background:#0E171F;color:#fff;font:600 13px 'Archivo',system-ui,sans-serif;padding:6px 8px}
.snuovaatt{display:block;width:100%;margin-top:6px;min-height:36px;border:1px dashed #4A5F72;background:none;color:#AFC0CE;border-radius:8px;font:700 12.5px 'Archivo',system-ui,sans-serif;cursor:pointer}.snuovaatt:hover{color:#fff;border-color:#8FA3B4}
.snav{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3A4C5B transparent}
.sgr{font:800 11px 'Archivo',system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7F93A5;padding:8px 10px 3px}
.sit{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;font:700 14.5px 'Archivo',system-ui,sans-serif;color:#DCE3E9;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.sit:hover{background:#22323F}
.sit svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sit.on{background:#fff;color:var(--ink)}
.sit:focus-visible,.seg button:focus-visible,.snuova:focus-visible,.srosso:focus-visible{outline:3px solid #9CC3EE;outline-offset:1px}
.sbd{margin-left:auto;background:#F2B705;color:var(--ink);font:800 12px 'Archivo',system-ui,sans-serif;border-radius:999px;padding:2px 8px}
.sbd.r{background:#E8A8A3}
.sfondo{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.snuova{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:11px 12px;font:800 15px 'Archivo',system-ui,sans-serif;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:left;cursor:pointer}
.snuova svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round}
.snuova small{grid-column:2;font:400 12px 'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--muted)}
.srosso{background:#B3261E;color:#fff;border:0;border-radius:12px;padding:13px 12px;font:800 15px 'Archivo',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.srosso:hover{background:#951E18}
.srosso svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2}
.schiusa{border:2px solid #6FBF73;color:#BFE5C1;border-radius:12px;padding:10px 12px;text-align:center;font:700 14px 'Archivo',system-ui,sans-serif}
.spiede{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8FA2B3;padding:0 4px}
.spiede button{background:none;border:0;color:#DCE3E9;font:700 13px 'Archivo',system-ui,sans-serif;cursor:pointer;padding:4px}
.dmain{display:flex;flex-direction:column;min-width:0}
.tbar{position:sticky;top:0;z-index:20;min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 28px}
.ttit h1{font:800 23px 'Archivo',system-ui,sans-serif;margin:0;line-height:1.15}
.tsub{color:var(--muted);font-size:14px}
.tdx{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tchip{font:700 12.5px 'Archivo',system-ui,sans-serif;border-radius:999px;padding:4px 10px;background:#EEF2F5;color:var(--muted)}
.btn.tb{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px;text-decoration:none}
.smenu{display:none;background:none;border:2px solid var(--line);border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer}
.dcont{padding:22px 28px 40px;max-width:1180px;width:100%}
.h2s{margin:0;font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kcard{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
button.kcard{cursor:pointer}button.kcard:hover{border-color:#9CC3EE}
.kl{font:700 13px 'Archivo',system-ui,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv{font:900 32px 'Archivo',system-ui,sans-serif;line-height:1.1}
.kv small{font-size:16px;color:var(--muted);font-weight:700}
.ks{font-size:13.5px}
.cols{align-items:start}
.voce{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #EEF1F4}
.voce i{width:8px;height:38px;border-radius:4px}
.voce b{font:700 15px 'Archivo',system-ui,sans-serif}
.voce small{display:block;color:var(--muted);font-size:13px}
.chipbtn{border:0;cursor:pointer}
.sveil{display:none}
@media (max-width:980px){
  .dapp{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:286px;max-width:86vw;transform:translateX(-102%);transition:transform .2s}
  body.menu-on .side{transform:none}
  body.menu-on .sveil{display:block;position:fixed;inset:0;background:rgba(10,18,25,.45);z-index:25}
  .smenu,.smenu-x{display:inline-flex;align-items:center;justify-content:center}
  .tbar{padding:10px 16px}
  .dcont{padding:16px 16px 32px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){ .ttit h1{font-size:19px} .tdx{margin-left:0;width:100%} .tchip{display:none} }

/* ---------- interrogazione orale ---------- */
.or-punti{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:sticky;top:68px;z-index:5;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.or-punti b{display:block;font:900 24px 'Archivo',system-ui,sans-serif}
.or-term{font:800 24px/1.2 'Archivo',system-ui,sans-serif}
.or-def{margin:10px 0;font-size:17px;line-height:1.45;background:#F6F8FA;border-radius:10px;padding:10px 12px}
.or-b{flex:1;min-width:120px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font:800 16px 'Archivo',system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.or-b small{font-weight:400;color:var(--muted)}
.or-b.ok.on{background:#1F7A3D;border-color:#1F7A3D;color:#fff}.or-b.mz.on{background:#B36B00;border-color:#B36B00;color:#fff}.or-b.no.on{background:#B3261E;border-color:#B3261E;color:#fff}
.or-b.on small{color:#fff}
.or-b:focus-visible{outline:3px solid #9CC3EE;outline-offset:2px}

.or-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.or-info div{background:#F6F8FA;border-radius:12px;padding:10px 12px}
.or-info b{display:block;font:900 22px 'Archivo',system-ui,sans-serif}
.or-info small{color:var(--muted);font-size:13px}
@media (max-width:760px){.or-info{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note.ok{background:#E3F3E7;color:#12401F}

/* ---------- restyling area docenti (2026-11): solo dentro .dapp, l'app degli alunni non cambia ---------- */
.dapp{--bg:#F4F3EF;--line:#DCD9D0;background:var(--bg);--f1:#1F5FA8;--f2:#6B4FA0;--f3:#B4511A;--f4:#2E7D32}
.dapp .card{border-color:var(--line);border-radius:16px}
.dapp .tbar{background:#FBFAF7;border-bottom-color:var(--line)}
.dapp .side{background:#16202A}
.dapp .sed{background:#1E2B37}
.dapp .seg{background:#1E2B37}
.dapp .sit{min-height:40px;font-size:15px}
.dapp .sit.fase::before{content:"";width:8px;height:8px;border-radius:99px;flex:none;margin:0 -2px 0 0;order:2;display:none}
.dapp .sit.f1 svg{color:#7FB0E8}.dapp .sit.f2 svg{color:#B9A3E0}.dapp .sit.f3 svg{color:#EBA374}.dapp .sit.f4 svg{color:#86C78A}
.dapp .sit.on svg{color:inherit}
.dapp .sit.on.f1{color:var(--f1)}.dapp .sit.on.f2{color:#5A3F8C}.dapp .sit.on.f3{color:#9A4A00}.dapp .sit.on.f4{color:var(--f4)}
.ssubs{display:none;flex-direction:column;gap:1px;margin:2px 0 6px 20px;padding-left:10px;border-left:2px solid #2E3D4A}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {

/* ---------- area docenti: quiz (seconda parte della prova), ammissione e interrogazione orale ---------- */
function tempoMs(ms) { var s = Math.round((ms || 0) / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ' h ' : '') + m + ' min ' + ('0' + (s % 60)).slice(-2) + ' s'; }
function quizDi(id) { return (S.d.quiz || []).filter(function (q) { return q.id === id; })[0] || { indovinati: 0, soglia: 260, sessioni: 0, risposte: 0, corrette: 0, errori: 0, persi: 0, massimo: 0, ms: 0, stato: 'chiuso', ultime: [] }; }
function votiDi(id) { return ((S.d.admin && S.d.admin.voti) || []).filter(function (v) { return v.id === id; })[0] || {}; }
function dataBreve(iso) { var d = new Date(iso); return d.getDate() + ' ' + MESI[d.getMonth()] + ', ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
// n = domande dell'interrogazione (gli studenti BES ne hanno la metà: ogni punto vale in proporzione)
function votoOraleDa(punti, escluso, n) { var o = RG().orale, k = n && n !== o.domande ? o.domande / n : 1; return Math.round((o.base + (escluso ? o.passoEsclusi : o.passo) * punti * k) * 1000) / 1000; }

/* stato del quiz di un alunno, come etichetta: da esso dipende l'ammissione all'interrogazione */
function chipQuiz(q) {
  if (q.stato === 'superato') return '<span class="chip s-approvata">Ammesso</span><br><span class="muted" style="font-size:13px">quiz superato il ' + esc(dataBreve(q.superata)) + '</span>';
  if (q.stato === 'scaduto') return '<span class="chip s-correggere">Non ammesso</span><br><span class="muted" style="font-size:13px">quiz non completato: ' + q.indovinati + ' / ' + q.soglia + '</span>';
  if (q.stato === 'chiuso') return '<span class="chip s-vuota">Quiz non aperto</span>' + (q.partenza && q.scadenza ? '<br><span class="muted" style="font-size:13px">si apre il ' + esc(dataBreve(q.partenza)) + '</span>' : '');
  return '<span class="chip s-inviata">' + (q.stato === 'in corso' ? 'In corso' : 'Non iniziato') + '</span><br><span class="muted" style="font-size:13px">' + q.indovinati + ' / ' + q.soglia + '</span>';
}
function scadenzeQuiz() {
  var q = (S.d.admin && S.d.admin.impostazioni && S.d.admin.impostazioni.quiz) || null; if (!q) return '';
  var cl = S.filtro.classe && S.filtro.classe !== 'tutte' ? [S.filtro.classe] : CLASSI();
  return cl.map(function (c) {
    var d = (q.scadenze || {})[c], p = (q.partenze || {})[c], now = Date.now();
    if (d && p && now < Date.parse(p)) return '<span class="chip s-vuota">' + esc(c) + ': quiz dal ' + esc(oraIt(p)) + ' al ' + esc(oraIt(d)) + '</span>';
    return '<span class="chip ' + (d ? (now > Date.parse(d) ? 's-correggere' : 's-inviata') : 's-vuota') + '">' + esc(c) + ': ' + (d ? (now > Date.parse(d) ? 'quiz scaduto il ' : 'quiz entro il ') + esc(oraIt(d)) : 'quiz non aperto') + '</span>'; }).join('');
}

/* --- interrogazione orale --- */
function paginaOrale() {
  if (S.or) return schedaOrale();
  var righe = (S.d.panoramica || []).filter(function (r) { return inClasse(r.id); });
  var fatte = righe.filter(function (r) { return votiDi(r.id).orale; }).length, puo = PUO('voti') && !RO();

  var h = '<section class="card stack" id="oraleTab"><h2 style="margin:0;font-size:22px">Interrogazioni</h2>' +
    '<p class="muted" style="margin:0"><b>È ammesso all\'interrogazione solo chi ha superato il quiz</b> entro la scadenza: gli altri non vengono interrogati e restano senza voto (le loro definizioni restano sui cartelloni). ' +
    'Per ogni alunno ammesso l\'app pesca <b>' + RG().orale.domande + ' termini</b> tra tutti quelli del glossario (mai i suoi, bilanciati sulle aree, di preferenza i meno usciti nella classe). ' +
    'Ogni risposta vale 1 punto se corretta, ½ se parziale, 0 se sbagliata. <b>' + regolaOrale() + '</b> (massimo ' + fv(RG().orale.max) + '); per gli esclusi dallo scritto ' + fv(RG().orale.base) + ' + ' + frz(RG().orale.passoEsclusi) + ' per punto (massimo ' + fv(RG().orale.maxEsclusi) + '). ' +
    'Il <b>voto finale</b> è la ' + mediaTxt() + ' (per gli esclusi vale solo l\'orale): oltre il mezzo voto si arrotonda all\'intero superiore, sotto a quello inferiore (7,75 → 8 · 7,5 → 7,5 · 7,4 → 7).</p>' +
    '<div class="row"><span class="chip s-approvata">' + amm + ' su ' + righe.length + ' ammessi (quiz superato)</span><span class="chip s-vuota">' + fatte + ' interrogati</span>' + (fuori ? '<span class="chip s-correggere">' + fuori + ' non ammessi: senza voto</span>' : '') + scadenzeQuiz() + '</div>' +
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Alunno</th><th style="text-align:right">Classe</th><th>Ammissione (quiz)</th><th style="text-align:right">Scritto</th><th style="text-align:right">Orale</th><th style="text-align:right">Finale</th><th>Quando</th><th></th></tr></thead><tbody>';

/* --- calendario delle interrogazioni --- */
function oggiIso() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function giornoIt(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }); }
function celPiano(r, q, o, puo) {
  var p = q.piano;
  if (!q.superata || o) return p && !o ? '<span class="muted" style="font-size:13px">' + esc(giornoIt(p.data)) + '</span>' : '';

  return '<div class="row" style="gap:4px;flex-wrap:nowrap"><input type="date" aria-label="Giorno dell\'interrogazione di ' + esc(r.nome) + '" data-pgiorno="' + r.id + '" value="' + (p ? p.data : '') + '" onchange="salvaPiano(\'' + r.id + '\')" style="min-height:38px;max-width:150px">' +
    '<select aria-label="Ora di lezione" data-pora="' + r.id + '" onchange="salvaPiano(\'' + r.id + '\')" style="min-height:38px;max-width:86px"><option value="">ora</option>' +

function salvaPiano(id) {
  var g = document.querySelector('[data-pgiorno="' + id + '"]'), o = document.querySelector('[data-pora="' + id + '"]');
  api('pianoorale', { alunno: id, data: g ? g.value : '', ora: o ? o.value : '' }).then(function (x) {
    var q = quizDi(id); q.piano = x.piano;
    toast(x.piano ? nomeAlunno(id) + ': ' + giornoIt(x.piano.data) + (x.piano.ora ? ', ' + x.piano.ora + 'ª ora' : '') : nomeAlunno(id) + ': da programmare');
    var b = $('orGiorno'); if (b) b.outerHTML = elencoDelGiorno((S.d.panoramica || []).filter(function (r) { return inClasse(r.id); }), PUO('voti') && !RO());
  }).catch(function (e) { toast(errMsg(e), true); });
}
function elencoDelGiorno(righe, puo) {
  var g = S.orG || oggiIso();
  var lista = righe.filter(function (r) { var p = quizDi(r.id).piano; return p && p.data === g; })
    .sort(function (a, b) { return ((quizDi(a.id).piano.ora || 99) - (quizDi(b.id).piano.ora || 99)) || a.nome.localeCompare(b.nome); });

    'Chi indovina tutti i termini richiesti entro la scadenza è ammesso all\'interrogazione; gli altri restano senza voto. A ogni errore l\'alunno torna indietro di ' + RG().quiz.passo + ' termini e la risposta giusta non viene mostrata.</p>' +
    '<div class="grid4"><div><label for="qzSoglia">Termini da indovinare (su ' + tot + ')</label><input id="qzSoglia" type="number" min="10" max="' + tot + '" step="1" value="' + (q.soglia || tot) + '"></div>' +
    '<div><label for="qzSec">Secondi per rispondere</label><input id="qzSec" type="number" inputmode="numeric" min="10" max="300" step="1" value="' + RG().quiz.secondi + '"><span class="muted" style="font-size:13px">meno tempo = più difficile copiare (con 20-25 secondi non si fa in tempo a chiedere a un\'IA)</span></div>' +
    '</div><div class="grid4">' +
    CLASSI().map(function (c) {
      var d = (q.scadenze || {})[c], p = (q.partenze || {})[c], now = Date.now();
      var st = !d ? 'quiz chiuso: manca la scadenza' : now > Date.parse(d) ? 'quiz chiuso: scadenza passata' : p && now < Date.parse(p) ? 'si apre il ' + oraIt(p) : 'quiz aperto';
      return '<div><label for="qzPa_' + c + '">Apertura del quiz · ' + esc(c) + '</label><input id="qzPa_' + c + '" type="datetime-local" value="' + (p ? isoLocale(p) : '') + '">' +
        '<span class="muted" style="font-size:13px">vuota = si apre subito</span></div>' +
        '<div><label for="qzSc_' + c + '">Scadenza del quiz · ' + esc(c) + '</label><input id="qzSc_' + c + '" type="datetime-local" value="' + (d ? isoLocale(d) : '') + '">' +
        '<span class="muted" style="font-size:13px">' + esc(st) + '</span></div>'; }).join('') + '</div>' +
    '<div class="row"><button class="btn" id="qzSalva" onclick="salvaQuizImp(this)">Salva le regole del quiz</button></div></section>';
}
function salvaQuizImp(btn) {
  var sc = {}, pa = {}; CLASSI().forEach(function (c) { var v = $('qzSc_' + c).value, w = $('qzPa_' + c).value; sc[c] = v ? new Date(v).toISOString() : ''; pa[c] = w ? new Date(w).toISOString() : ''; });
  btn.disabled = true;
  api('impostazioni', { quiz: { soglia: $('qzSoglia').value, secondi: $('qzSec').value, scadenze: sc, partenze: pa } }).then(function () { return ricarica('Regole del quiz salvate'); }).catch(function (e) { toast(errMsg(e), true); btn.disabled = false; });
}

/* regole personali del quiz (PDP, DSA…): meno termini da indovinare e/o meno termini persi a ogni errore */
function regolePersonaliQuiz(id) {
  var q = quizDi(id), imp = (S.d.admin && S.d.admin.impostazioni && S.d.admin.impostazioni.quiz) || {}, sc = imp.soglia || S.d.termini.length, pc = RG().quiz.passo;
  var B = q.bes || null;
  S.qpB = { attivo: !!B, secondi: B && B.secondi != null ? String(B.secondi) : '', dimezza: B ? B.dimezza !== false : true };
  S.qpB.tempo = B && B.secondi === 0 ? 'no' : B && B.secondi ? 'mio' : 'classe';
  var salva = function (soglia, passo) {
    var b = S.qpB.attivo ? { attivo: true, secondi: S.qpB.tempo === 'no' ? 0 : S.qpB.tempo === 'classe' ? '' : String(S.qpB.secondi).trim(), dimezza: S.qpB.dimezza } : { attivo: false };
    api('quizpersonale', { alunno: id, soglia: soglia, passo: passo, bes: b }).then(function (x) {
      return ricarica(soglia === '' && passo === '' && !x.bes ? 'Regole della classe per ' + nomeAlunno(id) : 'Regole personali salvate per ' + nomeAlunno(id) + (x.bes ? ' (BES)' : '') + (x.superata ? ': ha già indovinato abbastanza termini, è ammesso all\'orale' : ''));
    }).catch(function (e) { toast(errMsg(e), true); });
  };
  S.qpS = q.sogliaPersonale != null ? String(q.sogliaPersonale) : ''; S.qpP = q.passoPersonale != null ? String(q.passoPersonale) : '';
  var scelte = [{ t: 'Salva le regole personali', f: function () { salva(String(S.qpS).trim(), String(S.qpP).trim()); } }];
  if (q.sogliaPersonale != null || q.passoPersonale != null || B) scelte.push({ t: 'Torna alle regole della classe', warn: true, f: function () { S.qpB.attivo = false; salva('', ''); } });
  finestra('BES e regole personali · ' + nomeAlunno(id),
    '<p style="margin:0">Per un alunno con PDP o DSA puoi chiedere <b>meno termini</b> e togliere <b>meno termini a ogni errore</b>. Lascia vuoto un campo per usare la regola della classe. ' +
    nomeAlunno(id) + ' ha indovinato finora <b>' + q.indovinati + '</b> termini.</p>' +
    '<div class="grid2"><div><label for="qpSoglia">Termini da indovinare</label><input id="qpSoglia" type="text" inputmode="numeric" placeholder="classe: ' + sc + '" value="' + (q.sogliaPersonale != null ? q.sogliaPersonale : '') + '" oninput="S.qpS=this.value"></div>' +
    '<div><label for="qpPasso">Termini persi a ogni errore</label><input id="qpPasso" type="text" inputmode="numeric" placeholder="classe: ' + pc + '" value="' + (q.passoPersonale != null ? q.passoPersonale : '') + '" oninput="S.qpP=this.value"></div></div>' +
    '<p class="muted" style="margin:0;font-size:14px">Se con la nuova soglia ha già indovinato abbastanza termini, risulta subito ammesso all\'interrogazione.</p>' +
    '<fieldset class="stack" style="gap:10px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:0"><legend style="font-weight:700;padding:0 6px">Studente BES</legend>' +
      '<label class="row" style="gap:10px;font-weight:700"><input type="checkbox" id="qpBes" ' + (B ? 'checked' : '') + ' onchange="S.qpB.attivo=this.checked;$(\'qpBesOpz\').hidden=!this.checked" style="width:22px;height:22px"> Segna come studente BES</label>' +
      '<div id="qpBesOpz" class="stack" style="gap:10px"' + (B ? '' : ' hidden') + '>' +
        '<div><label for="qpTempo">Tempo per rispondere nel quiz</label><select id="qpTempo" onchange="S.qpB.tempo=this.value;$(\'qpSecBox\').hidden=this.value!==\'mio\'">' +
          [['classe', 'Come la classe (' + RG().quiz.secondi + ' secondi)'], ['mio', 'Secondi personali'], ['no', 'Senza limite di tempo']].map(function (o) { return '<option value="' + o[0] + '"' + (S.qpB.tempo === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
        '<div id="qpSecBox"' + (S.qpB.tempo === 'mio' ? '' : ' hidden') + '><label for="qpSec">Secondi per rispondere (10-600)</label><input id="qpSec" type="text" inputmode="numeric" value="' + esc(S.qpB.tempo === 'mio' ? S.qpB.secondi : '') + '" oninput="S.qpB.secondi=this.value"></div>' +
        '<label class="row" style="gap:10px"><input type="checkbox" id="qpDim" ' + (S.qpB.dimezza ? 'checked' : '') + ' onchange="S.qpB.dimezza=this.checked" style="width:22px;height:22px"> Pulsante «Dimezza opzioni» nel quiz (da 4 a 2 definizioni)</label>' +
        '<p class="muted" style="margin:0;font-size:14px">All\'interrogazione lo studente BES risponde su <b>' + Math.max(1, Math.round(RG().orale.domande / 2)) + ' termini</b> invece di ' + RG().orale.domande + ': ogni punto vale doppio, il voto massimo resta ' + fv(RG().orale.max) + '.</p>' +
      '</div></fieldset>', scelte);
}

/* proroga individuale del quiz: una data dopo la scadenza della classe; si può togliere */
function prorogaQuiz(id) {
  var q = quizDi(id), base = q.proroga || q.scadenzaClasse, def = new Date(Math.max(Date.parse(base), Date.now()) + 2 * 86400000);
  S.qzPr = isoLocale(def.toISOString());
  var scelte = [{ t: 'Concedi la proroga', f: function () {
    if (!S.qzPr) { toast('Scegli la data della proroga.', true); return; }
    api('quizproroga', { alunno: id, data: new Date(S.qzPr).toISOString() }).then(function (x) { return ricarica('Proroga del quiz per ' + nomeAlunno(id) + ' fino a ' + oraIt(x.proroga)); }).catch(function (e) { toast(errMsg(e), true); });
  } }];
  if (q.proroga) scelte.push({ t: 'Togli la proroga', warn: true, f: function () {
    api('quizproroga', { alunno: id, data: null }).then(function () { return ricarica('Proroga del quiz tolta a ' + nomeAlunno(id)); }).catch(function (e) { toast(errMsg(e), true); });
  } });
  finestra('Proroga del quiz · ' + nomeAlunno(id),
    '<p style="margin:0">Scadenza del quiz della classe: <b>' + esc(oraIt(q.scadenzaClasse)) + '</b>' + (q.proroga ? ' · proroga attuale: <b>' + esc(oraIt(q.proroga)) + '</b>' : '') + '. ' +
    nomeAlunno(id) + ' è a <b>' + q.indovinati + ' termini su ' + q.soglia + '</b>: con la proroga può continuare da lì.</p>' +
    '<div><label for="qzPrData">Nuova scadenza del quiz per questo alunno</label><input id="qzPrData" type="datetime-local" value="' + esc(S.qzPr) + '" oninput="S.qzPr=this.value"></div>', scelte);
}

/* tempo complessivo sul quiz fino al termine: al superamento, alla scadenza, oppure finora */
function fineQuizHtml(q) {
  if (!q.sessioni) return '—';
  var t = tempoMs(q.msFine != null ? q.msFine : q.ms);
  if (q.superata) return '<span title="Superato in ' + (q.giorniSup || 1) + (q.giorniSup === 1 ? ' giorno' : ' giorni') + ' dalla prima sessione">' + t + '</span>';
  if (q.stato === 'scaduto') return '<span class="no" style="font-weight:400">' + t + '</span>';
  return '<span class="muted" style="font-weight:400">' + t + ' · in corso</span>';
}

/* --- solleciti per il quiz: chi non è mai entrato e chi è indietro rispetto al tempo passato --- */
function bloccoSollecitiQuiz(righe) {
  if (RO()) return '';
  var now = Date.now(), mai = [], indietro = [], scad = null;
  righe.forEach(function (r) {
    var q = quizDi(r.id);
    if (q.superata || (q.stato !== 'in corso' && q.stato !== 'non iniziato') || !q.scadenza) return;
    var fine = Date.parse(q.scadenza), ini = q.partenza ? Date.parse(q.partenza) : (q.prima ? Date.parse(q.prima) : now);
    if (!scad || fine < scad) scad = fine;
    if (!q.sessioni) { mai.push(r); return; }
    var tempo = fine > ini ? Math.min(1, Math.max(0, (now - ini) / (fine - ini))) : 1, fatto = q.soglia ? q.indovinati / q.soglia : 0;
    if (fatto + 0.1 < tempo) indietro.push({ r: r, q: q });
  });
  if (!mai.length && !indietro.length) return '<section class="card stack" id="sollQuiz"><h3 style="margin:0;font-size:19px">Solleciti per il quiz</h3><p class="muted" style="margin:0">Nessuno da sollecitare: chi ha il quiz aperto è al passo con il tempo.</p></section>';
  var quando = scad ? oraIt(new Date(scad).toISOString()) : 'alla scadenza';
  var msgCl = 'Promemoria: il QUIZ GLOSSARIO si chiude ' + quando + ' ed è un termine tassativo. Solo chi lo supera entro la scadenza è ammesso all\'interrogazione. Chi non ha ancora iniziato lo faccia subito: si entra con il proprio codice personale.';
  var msgUno = function (r, q) {
    return (q ? 'Nel quiz del glossario sei a ' + q.indovinati + ' termini su ' + q.soglia + ': ' : 'Non hai ancora iniziato il quiz del glossario: ') + 'si chiude ' + quando + ' e non ci saranno proroghe. Prof. Cerrato';
  };
  var riga = function (r, q) {
    return '<tr><td>' + esc(r.nome) + '</td><td>' + (q ? q.indovinati + ' / ' + q.soglia + ' <span class="muted">(' + Math.round(q.indovinati / q.soglia * 100) + '%)</span>' : '<span class="chip s-correggere">mai entrato</span>') + '</td>' +
      '<td><button class="btn sec tb" onclick="copiaTesto(this.getAttribute(\'data-t\'),this)" data-t="' + esc(msgUno(r, q)) + '">Copia messaggio</button></td></tr>';
  };
  return '<section class="card stack" id="sollQuiz"><h3 style="margin:0;font-size:19px">Solleciti per il quiz · ' + (mai.length + indietro.length) + '</h3>' +
    '<p class="muted" style="margin:0">Chi non è mai entrato e chi è indietro rispetto al tempo già passato (ha indovinato una parte dei termini più piccola della parte di tempo trascorsa). I messaggi personali sono da mandare uno per uno; il promemoria per la classe non contiene nomi.</p>' +
    '<div class="row"><button class="btn" id="qzSollCl" onclick="copiaTesto(this.getAttribute(\'data-t\'),this)" data-t="' + esc(msgCl) + '">Copia il promemoria per la classe</button></div>' +
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Alunno</th><th>Quiz</th><th></th></tr></thead><tbody>' +
    mai.map(function (r) { return riga(r, null); }).join('') + indietro.map(function (x) { return riga(x.r, x.q); }).join('') + '</tbody></table></div></section>';
}
function copiaTesto(t, btn) {
  var area = function () { finestra('Copia il testo', '<textarea style="width:100%;min-height:140px;font:inherit">' + esc(t) + '</textarea>', []); };
  var fatto = function () { if (btn) { var o = btn.textContent; btn.textContent = 'Copiato'; setTimeout(function () { btn.textContent = o; }, 1500); } toast('Testo copiato'); };
  try { navigator.clipboard.writeText(t).then(fatto, area); } catch (e) { area(); }
}

</script>
