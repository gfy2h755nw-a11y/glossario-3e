<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quiz del glossario</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#15212B">
<style>/*FONTI*/.qz-avviso{background:#FFF4E5;border:1px solid #F0C48A;color:#7A4B00;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.4}
</style>
<style>
/* testo del quiz non selezionabile né copiabile (resta scrivibile il campo del codice) */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* pagina del quiz: separata dalla pagina pubblica del glossario; un'unica colonna, comoda sul telefono */
:root{--ink:#15212B;--muto:#5B6976;--linea:#D3DCE3;--fondo:#F2F0EA;--carta:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--ink);font-family:'Atkinson Hyperlegible',Arial,sans-serif;font-size:17px;line-height:1.45}
.top{background:var(--ink);color:#fff}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .lg svg{display:block}
.top b{display:block;font-family:Archivo,Arial,sans-serif;font-size:17px;line-height:1.15}
.top .sott{display:block;font-size:13.5px;opacity:.85}
#hdr{margin-left:auto}
.top .hb{display:inline-flex;align-items:center;min-height:44px;color:#fff;background:none;font:700 15px Archivo,Arial,sans-serif;border:2px solid rgba(255,255,255,.45);border-radius:10px;padding:0 14px;text-decoration:none;white-space:nowrap;cursor:pointer}
.qz{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.qz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qz-top b{font:800 22px Archivo,Arial,sans-serif;flex:1}
.qz-x{display:inline-flex;align-items:center;min-height:44px;border:2px solid var(--linea);background:var(--carta);color:var(--ink);border-radius:10px;padding:8px 14px;font:700 15px Archivo,Arial,sans-serif;cursor:pointer;text-decoration:none}
.qz-riga{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qz-card{background:var(--carta);border-radius:16px;padding:18px;box-shadow:0 1px 0 var(--linea)}
.qz-card label{font-weight:700;display:block;margin-bottom:6px}
.qz-card input{font:700 22px monospace;letter-spacing:.15em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--linea);border-radius:10px;width:100%;max-width:260px}
.qz-btn{min-height:48px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:800 16px Archivo,Arial,sans-serif;padding:12px 20px;cursor:pointer}
.qz-btn[disabled]{opacity:.5}
.qz-num{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.qz-num div{background:var(--carta);border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;color:var(--muto)}
.qz-num b{display:block;font:800 20px Archivo,Arial,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.qz-prog{height:10px;border-radius:99px;background:#DDD8CC;overflow:hidden;margin:0 0 14px}
.qz-prog i{display:block;height:100%;background:#1F7A3D}
.qz-tempo{height:8px;border-radius:99px;background:#DDD8CC;overflow:hidden;margin:12px 0}
.qz-tempo i{display:block;height:100%;background:#2A6CC4;width:100%}
.qz-tempo.poco i{background:#B3261E}
.qz-term{font:800 30px/1.15 Archivo,Arial,sans-serif;margin:4px 0 2px}
.qz-area{font-size:14px;color:var(--muto)}
.qz-op{display:block;width:100%;text-align:left;font:inherit;font-size:17px;line-height:1.4;background:#fff;color:var(--ink);border:2px solid var(--linea);border-radius:14px;padding:14px 16px;margin:10px 0;cursor:pointer}
.qz-op:hover:not([disabled]){border-color:var(--ink)}
.qz-op b{font:800 15px Archivo,Arial,sans-serif;margin-right:8px}
.qz-op[disabled]{color:inherit;opacity:1;cursor:default}
.qz-op.ok{border-color:#1F7A3D;background:#E3F3E7}
.qz-op.no{border-color:#B3261E;background:#FBE6E4}
.qz-es{font:800 18px Archivo,Arial,sans-serif;margin:10px 0}
.qz-su{background:#E3F3E7;border:2px solid #1F7A3D;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:700}
.qz-err{color:#B3261E;font-weight:700;margin:10px 0 0}
:focus-visible{outline:3px solid #2A6CC4;outline-offset:2px}
/* durante la domanda: una riga sola con i progressi, e il tempo che resta visibile in alto mentre si scorrono le definizioni */
.qz-mini{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:15px;color:var(--muto);margin:0 0 6px}
.qz-mini b{font:800 19px Archivo,Arial,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
.qz-orologio{position:sticky;top:0;z-index:2;background:var(--carta);margin:6px -18px 0;padding:8px 18px 4px;border-bottom:1px solid #EEF1F4}
.qz-orologio .qz-tempo{margin:0 0 4px}
.qz-codice{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.qz-regole{margin:0;padding-left:20px}.qz-regole li{margin:6px 0}
h2.qz-h{font:800 18px Archivo,Arial,sans-serif;margin:18px 0 4px}
@media (max-width:520px){.qz{padding-top:12px}.qz-card{padding:16px}.qz-orologio{margin:6px -16px 0;padding:8px 16px 4px}.qz-term{font-size:24px}.qz-num{grid-template-columns:repeat(2,minmax(0,1fr))}.top .sott{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="lg" id="logo"></div><div><b>Quiz del glossario</b><span class="sott" id="qzSott">IIS «E. Barsanti» · Laboratorio odontotecnico</span></div><div id="hdr"></div></div></header>
<main class="qz" id="qz" aria-live="off"></main>
<script>
/* salute dell'app: un errore di questa pagina arriva al prof. Cerrato (pochi per visita, senza dati personali) */
(function () { var n = 0, visti = {}; function invia(m, d) { m = String(m || '').slice(0, 300); if (!m || n >= 5 || visti[m]) return; visti[m] = 1; n++; try { fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: JSON.stringify({ azione: 'erroreclient', origine: 'quiz', messaggio: m, dettaglio: String(d || '').slice(0, 900), disp: /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent) ? 'telefono' : 'PC' }) }).catch(function () {}); } catch (e) {} }
  window.addEventListener('error', function (e) { invia(e.message, (e.filename || '') + ':' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; invia((r && r.message) || String(r), r && r.stack); }); })();
</script>
<script>/*POSTER*/</script>
<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
try { document.getElementById('logo').innerHTML = Poster.logo(11); } catch (e) { /* logo non disponibile */ }
/* ---------- quiz, seconda parte della prova (pagina a sé, con il codice personale) ---------- */
var Quiz = (function () {
  var KEY = 'glossario3e_codice', cod = '', st = null, ses = null, dom = null, tot = 0, nome = '', timer = null, scad = 0, finePrec = 0, attesa = false;
  var box = function () { return document.getElementById('qz'); };
  // prova del docente (/quiz?prova=1, &bes=1 per provare le misure personalizzate): niente viene salvato tra i dati della classe
  var PROVA = /[?&]prova=1/.test(location.search), PMIS = PROVA && /[?&]bes=1/.test(location.search), provaAvviata = false;
  var MIS = { s: PMIS ? 1 : 0, d: PMIS ? 1 : 0 }; // misure da provare: senza tempo, «Dimezza opzioni»
  function chiama(p) {
    if (PROVA) { p.prova = 1; if (MIS.s || MIS.d) p.bes = { s: MIS.s, d: MIS.d }; }
    return fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) }).then(function (r) { return r.json(); })
      .then(function (r) { if (!r.ok) throw new Error(r.errore || 'Errore'); return r.dati; });
  }
  function tempo(ms) { var s = Math.round(ms / 1000), m = Math.floor(s / 60); return m + ':' + ('0' + (s % 60)).slice(-2); }
  function testa() {
    var h = document.getElementById('hdr');
    if (h) h.innerHTML = dom ? '<button class="hb" onclick="Quiz.chiudi()">Termina</button>' : '';
    return dom ? '' : '<div class="qz-top"><b>Quiz del glossario</b></div>';
  }
  function quandoIt(iso) { return new Date(iso).toLocaleString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); }
  function numeri() {
    var pc = Math.min(100, Math.round(st.indovinati / st.soglia * 100));
    return (st.superata ? '<div class="qz-su">Quiz superato: sei ammesso all\'interrogazione. Puoi continuare ad allenarti: ora gli errori non tolgono più nulla.</div>' : '') +
      '<div class="qz-mini qz-num"><span>' + esc(nome) + '</span><span><b id="qzInd">' + st.indovinati + ' / ' + st.soglia + '</b> termini indovinati</span>' +
      (ses.r ? '<span>oggi ' + ses.c + (ses.c === 1 ? ' giusta' : ' giuste') + ', ' + (ses.e || 0) + ((ses.e || 0) === 1 ? ' errore' : ' errori') + '</span>' : '') + '</div>' +
      '<div class="qz-prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + st.soglia + '" aria-valuenow="' + Math.min(st.indovinati, st.soglia) + '" aria-label="Termini indovinati"><i style="width:' + pc + '%"></i></div>' +
      (st.scadenza && !st.superata ? '<p class="qz-area" id="qzScad" style="margin:-8px 0 10px">Da completare entro ' + esc(new Date(st.scadenza).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</p>' : '');
  }
  var R = { secondi: 60, opzioni: 4, passo: 5 };
  function regole(r) {
    return '<li>Compare un termine con <b>' + (r.opzioni === 4 ? 'quattro' : r.opzioni) + ' definizioni</b>: scegli quella giusta ' + (r.senzaTempo ? '<b>senza limite di tempo</b>' : 'entro <b>' + r.secondi + ' secondi</b>') + '. Ogni risposta giusta è un termine indovinato.</li>' +
      (r.dimezza ? '<li>Puoi premere <b>«Dimezza opzioni»</b>: restano due definizioni, una delle quali è quella giusta.</li>' : '') +
      '<li><b>Se sbagli</b> (o lasci scadere il tempo, o esci a metà domanda chiudendo o ricaricando la pagina) la risposta giusta non viene mostrata' + (r.passo ? ' e <b>torni indietro di ' + r.passo + (r.passo === 1 ? ' termine' : ' termini') + '</b>' : '') + ': per andare avanti devi studiare le definizioni.</li>' +
      '<li>I progressi restano salvati: puoi fermarti e riprendere quando vuoi, entro la scadenza.</li>' +
      '<li>Il quiz è superato quando hai indovinato tutti i termini richiesti: solo allora sei <b>ammesso all\'interrogazione</b>.</li>';
  }
  function accesso(err) {
    stop(); dom = null;
    var salvato = ''; try { salvato = localStorage.getItem(KEY) || ''; } catch (e) { /* senza memoria si scrive il codice a mano */ }
    box().innerHTML = testa() + (PROVA ? '<div class="qz-su" style="background:#FFF3E6;border-color:#E8711A">Prova del docente: vedi il quiz come lo vedono gli studenti. Niente viene salvato tra i dati della classe.' +
        '<label style="display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:400"><input type="checkbox" id="qzMisS" style="width:22px;height:22px"' + (MIS.s ? ' checked' : '') + ' onchange="Quiz.misura(\'s\',this.checked)"> Senza limite di tempo (misura personalizzata)</label>' +
        '<label style="display:flex;gap:10px;align-items:center;margin-top:6px;font-weight:400"><input type="checkbox" id="qzMisD" style="width:22px;height:22px"' + (MIS.d ? ' checked' : '') + ' onchange="Quiz.misura(\'d\',this.checked)"> Con il pulsante «Dimezza opzioni»</label></div>' : '') +
      '<div class="qz-card"><label for="qzCod">' + (PROVA ? 'Il tuo codice da docente' : 'Il tuo codice personale') + '</label>' +
      '<div class="qz-codice"><input id="qzCod" autocomplete="off" autocapitalize="characters" maxlength="12" value="' + esc(err && cod ? cod : !PROVA && /^[A-Z0-9]{4,12}$/i.test(salvato) ? salvato : '') + '">' +
      '<button class="qz-btn" id="qzVia" onclick="Quiz.via()">Inizia</button></div>' + (err ? '<p class="qz-err" role="alert">' + esc(err) + '</p>' : '') +
      '<h2 class="qz-h">Come funziona</h2><ul class="qz-regole" id="qzReg">' + regole(R) + '</ul></div>';
    var i = document.getElementById('qzCod'); i.onkeydown = function (e) { if (e.key === 'Enter') Quiz.via(); }; i.focus();
    // le regole (secondi, definizioni, termini persi) sono quelle dell'attività del codice: si chiedono appena il codice è scritto
    var ult = '', chiedi = function () { var c = String(i.value || '').trim().toUpperCase(); if (c.length < 6 || c === ult) return; ult = c;
      chiama({ azione: 'quizregole', codice: c }).then(function (r) { if (r && r.opzioni) { R = r; var u = document.getElementById('qzReg'); if (u) u.innerHTML = regole(R); } }).catch(function () { /* restano quelle di sempre */ }); };
    i.oninput = chiedi; chiedi();
  }
  // una sola sessione per codice: gettone della sessione aperta qui e codice anonimo di questo dispositivo
  var tok = null;
  function dispositivo() {
    var k = 'glossario_disp', v = '';
    try { v = localStorage.getItem(k) || ''; if (!v) { v = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem(k, v); } } catch (e) { v = 'nd'; }
    return v;
  }
  function via() {
    cod = String(document.getElementById('qzCod').value || '').trim().toUpperCase();
    if (!cod) return accesso('Inserisci il tuo codice.');
    document.getElementById('qzVia').disabled = true;
    chiama({ azione: 'quizinizio', codice: cod, disp: dispositivo(), daCapo: PROVA && !provaAvviata }).then(function (d) {
      if (PROVA) provaAvviata = true;
      else try { localStorage.setItem(KEY, cod); } catch (e) { /* niente memoria */ }
      tok = d.tok;
      // attività di un collega: la sua materia e la dicitura di concessione
      if (d.conc) { var so = document.getElementById('qzSott'); if (so) so.textContent = 'IIS «E. Barsanti»' + (d.conc.materia ? ' · ' + d.conc.materia : '') + ' · Per gentile concessione del Prof. Danilo Cerrato'; }
      st = d.stato; ses = d.sessione; tot = d.totale; nome = d.nome; finePrec = 0;
      if (d.abbandono) Quiz._avviso = '<b>La domanda lasciata a metà conta come non data.</b> ' + (d.abbandono.persi ? 'Torni indietro di ' + d.abbandono.persi + (d.abbandono.persi === 1 ? ' termine' : ' termini') + ': ora sei a ' + d.abbandono.indovinati + ' su ' + st.soglia + '.' : '');
      domanda(d.domanda);
    }).catch(function (e) { accesso(e.message); });
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    var b = document.getElementById('qzTi'); if (b && b.style.transition && b.style.transition !== 'none') { var w = getComputedStyle(b).width; b.style.transition = 'none'; b.style.width = w; }
  }
  function domanda(d, tieniTempo) {
    dom = d; attesa = false;
    var senza = !d.secondi;
    var a = { it: d.nomeArea, colore: d.colore };
    box().innerHTML = testa() + '<div id="qzNum">' + numeri() + '</div>' +
      '<div class="qz-card" style="border-top:8px solid ' + esc(a.colore || '#15212B') + '"><div class="qz-area">' + esc(a.it ? d.area + '. ' + a.it : 'Domanda ' + d.n) + '</div><div class="qz-term">' + esc(d.termine) + '</div>' +
      (senza ? '<div class="qz-area" style="margin:6px 0 10px">Senza limite di tempo</div>' : '<div class="qz-orologio"><div class="qz-tempo" id="qzT"><i id="qzTi"></i></div><div class="qz-area" id="qzSec" aria-live="off">' + d.secondi + ' secondi</div></div>') +
      (d.lettere || ['A', 'B']).map(function (l) { return '<button class="qz-op" data-l="' + l + '" onclick="Quiz.rispondi(\'' + l + '\')"><b>' + l + '</b>' + esc(d[l]) + '</button>'; }).join('') +
      (d.dimezza ? '<button class="qz-btn" id="qzDim" style="background:#fff;color:#15212B;border:2px solid #15212B;margin-top:4px" onclick="Quiz.dimezza()">Dimezza opzioni</button>' : '') +
      '<div id="qzEs" aria-live="polite"></div></div>';
    stop();
    // la domanda è sullo schermo: da qui uscire senza rispondere conta come risposta non data
    if (!tieniTempo && d.id) requestAnimationFrame(function () { if (dom === d) chiama({ azione: 'quizvista', codice: cod, tok: tok, id: d.id }).catch(function () {}); });
    if (Quiz._avviso) { var av = document.createElement('div'); av.className = 'qz-avviso'; av.innerHTML = Quiz._avviso; box().insertBefore(av, box().children[1] || null); Quiz._avviso = ''; }
    if (senza) { if (!tieniTempo) window.scrollTo(0, 0); return; }
    if (!tieniTempo) window.scrollTo(0, 0);
    // il tempo parte quando la domanda è davvero sullo schermo; la barra la fa scorrere il browser (fluida anche
    // mentre si scorrono le definizioni o il telefono è occupato), il conto dei secondi si aggiorna qui
    var tot = d.secondi * 1000, b = document.getElementById('qzTi');
    var tick = function () {
      var r = scad - Date.now(); if (!document.getElementById('qzTi')) return stop();
      document.getElementById('qzT').className = 'qz-tempo' + (r < 8000 ? ' poco' : '');
      document.getElementById('qzSec').textContent = Math.max(0, Math.ceil(r / 1000)) + ' secondi';
      if (r <= 0) rispondi('');
    };
    var parti = function () {
      if (dom !== d || !document.getElementById('qzTi')) return;
      if (!tieniTempo || !scad) scad = Date.now() + tot;
      var r = Math.max(0, scad - Date.now());
      b.style.transition = 'none'; b.style.width = (r / tot * 100) + '%'; void b.offsetWidth;
      b.style.transition = 'width ' + r + 'ms linear'; b.style.width = '0%';
      tick(); timer = setInterval(tick, 200);
    };
    if (tieniTempo) parti(); else requestAnimationFrame(function () { requestAnimationFrame(parti); });
  }
  // «Dimezza opzioni»: restano due definizioni (la giusta e una sbagliata); il tempo non riparte
  function dimezza() {
    if (attesa || !dom) return;
    var b = document.getElementById('qzDim'); if (b) b.disabled = true;
    chiama({ azione: 'quizdimezza', codice: cod, tok: tok }).then(function (d) { if (!attesa) domanda(d.domanda, true); }).catch(function (e) { accesso(e.message); });
  }
  function rispondi(l) {
    if (attesa || !dom) return; attesa = true; stop();
    [].forEach.call(document.querySelectorAll('.qz-op'), function (b) { b.disabled = true; });
    chiama({ azione: 'quizrisposta', codice: cod, scelta: l, pausa: Quiz._pausa || 0, tok: tok }).then(function (d) {
      Quiz._pausa = 0; st = d.stato; ses = d.sessione;
      var e = d.esito;
      [].forEach.call(document.querySelectorAll('.qz-op'), function (b) { var x = b.getAttribute('data-l'); if (e.corretta && x === e.giusta) b.className = 'qz-op ok'; else if (!e.corretta && x === l) b.className = 'qz-op no'; });
      var t0 = Date.now(), prossima = d.domanda;
      document.getElementById('qzEs').innerHTML = '<div class="qz-es" style="color:' + (e.corretta ? '#1F7A3D' : '#B3261E') + '">' + (e.corretta ? 'Giusto!' : (e.scaduta ? 'Tempo scaduto' : 'Sbagliato') + (!e.persi ? '.' : st.indovinati === 0 ? ': perdi ' + (e.persi === 1 ? 'l\'unico termine indovinato' : 'i ' + e.persi + ' termini indovinati') + ' e torni a zero.' : ': torni indietro di ' + e.persi + ' termini. Ora sei a ' + st.indovinati + ' su ' + st.soglia + '.')) + '</div>' +
        (!e.corretta && !st.superata ? '<p class="qz-area" style="margin:0 0 10px">La risposta giusta non viene mostrata: ripassa «' + esc(e.termine) + '», tornerà.</p>' : '') +
        '<button class="qz-btn" id="qzAvanti">Prossimo termine</button>';
      var avanti = function () { if (!prossima) return; var p = prossima; prossima = null; clearTimeout(auto); Quiz._pausa = Math.min(Date.now() - t0, 15000); domanda(p); };
      var auto = setTimeout(avanti, 15000); // oltre 15 secondi di pausa il tempo della domanda successiva partirebbe comunque
      var b = document.getElementById('qzAvanti'); b.onclick = avanti; b.focus();
      var nm = document.getElementById('qzNum'); if (nm) nm.innerHTML = numeri();
    }).catch(function (e) { accesso(e.message); });
  }
  function apri(codice) {
    stop(); dom = null; accesso();
    if (codice && typeof codice === 'string') { document.getElementById('qzCod').value = codice; via(); }
  }
  function chiudi() {
    stop();
    if (dom && !attesa && document.querySelector('.qz-op:not([disabled])')) {
      attesa = true; [].forEach.call(document.querySelectorAll('.qz-op'), function (b) { b.disabled = true; });
      chiama({ azione: 'quizrisposta', codice: cod, scelta: '', pausa: Quiz._pausa || 0, tok: tok }).then(function (d) {
        Quiz._pausa = 0; st = d.stato; ses = d.sessione; ses._termina = d.esito; attesa = false; chiudi();
      }).catch(function (e) { accesso(e.message); });
      return;
    }
    if (dom && ses && ses.r) {
      dom = null;
      var tx = ses._termina; box().innerHTML = testa() + '<div class="qz-card"><div class="qz-term" style="font-size:24px">Sessione terminata</div>' + (tx ? '<p class="qz-avviso"><b>La domanda in corso conta come non data</b>' + (tx.persi ? ': ' + (tx.persi === 1 ? '1 termine perso.' : tx.persi + ' termini persi.') : '.') + '</p>' : '') + '<p>Hai risposto a <b>' + ses.r + '</b> domande: <b>' + ses.c + '</b> corrette e <b>' + (ses.e || 0) + '</b> ' + ((ses.e || 0) === 1 ? 'errore' : 'errori') + ' (' + (ses.p || 0) + ' termini persi), in <b>' + tempo(ses.ms) + '</b>.</p>' +
        '<p>Sei a <b>' + st.indovinati + '</b> termini indovinati su ' + st.soglia + (st.superata ? ': <b>quiz superato</b>, sei ammesso all\'interrogazione.' : '. Te ne mancano <b>' + Math.max(0, st.soglia - st.indovinati) + '</b>. I progressi restano salvati' + (st.scadenza ? ': hai tempo fino a ' + esc(quandoIt(st.scadenza)) + '.' : '.')) + '</p>' +
        '<div class="qz-riga"><button class="qz-btn" onclick="Quiz.riprendi()">Riprendi il quiz</button></div></div>';
      ses = null; window.scrollTo(0, 0); return;
    }
    accesso();
  }
  // si entra dal QR della scheda (?c=CODICE): il codice viene tolto subito dall'indirizzo
  function avvio() {
    var c = '';
    try { var p = new URLSearchParams(location.search); c = p.get('c') || p.get('quiz') || ''; if (c) history.replaceState(null, '', location.pathname); } catch (e) { /* indirizzo non leggibile */ }
    apri(/^[A-Za-z0-9]{4,12}$/.test(c) ? c.toUpperCase() : '');
  }
  function riprendi() { apri(cod); }
  // prova del docente: cambiare le misure fa ripartire la prova da capo, con le regole aggiornate
  function misura(k, v) {
    MIS[k] = v ? 1 : 0; provaAvviata = false;
    chiama({ azione: 'quizregole', codice: String((document.getElementById('qzCod') || {}).value || 'X').trim().toUpperCase() }).then(function (r) { if (r && r.opzioni) { R = r; var u = document.getElementById('qzReg'); if (u) u.innerHTML = regole(R); } }).catch(function () {});
  }
  return { riprendi: riprendi, avvio: avvio, apri: apri, chiudi: chiudi, via: via, rispondi: rispondi, dimezza: dimezza, misura: misura, _pausa: 0 };
})();
Quiz.avvio();

/* niente copia, taglia, menu del tasto destro o pressione lunga, selezione o trascinamento del testo, fuori dal campo del codice */
(function () {
  var campo = function (e) { var t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'); };
  ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (!campo(e)) e.preventDefault(); });
  });
})();
</script>
